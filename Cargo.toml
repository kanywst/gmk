[package]
name = "gmk"
version = "0.1.0"
edition = "2024"
description = "🚀 Bookmark & Interactive Git Clone Tool"
repository = "https://github.com/kanywst/gmk"
homepage = "https://github.com/kanywst/gmk"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
confy = "2"
serde = { version = "1.0", features = ["derive"] }
skim = "0.20"
colored = "3"
regex = "1.12"
directories = "6"
